        quaternion_wxyz: [0.0, 0.0, 1.0, 0.0]
        pos_tol_m: 0.030
        rot_tol_rad: 0.200
      preconditions:
        required_classes: []
        forbidden_classes: []
        expected_relations:
          - subject_class: gripper
            predicate: gripping
            object_class: workpiece
            min_score: 0.50
