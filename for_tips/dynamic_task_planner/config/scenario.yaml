scenario:
  name: ur5e_pick_place_holder_pick_place
  planner_frame: base_link
  robot:
    model: ur5e
    target_link: tool0

  object_classes:
    - parts box
    - plastic tray
    - workpiece
    - screwdriver
    - hand
    - inspection jig
    - wrench
    - cable bundle
    - safety goggles
    - gripper
    - holder

  relation_classes:
    - on
    - inside
    - beside
    - above
    - touching
    - near
    - gripping

  situation_priority:
    - S2
    - S4
    - S1
    - S5
    - S3
    - NORMAL

  steps:
    - id: STEP1_APPROACH_BOX_PICK
      phase: MOTION
      nominal_name: step1_approach_box_pick
      target_class: workpiece
      support_class: parts box
      destination_class: null
      replanning_enabled: true
      goal:
        type: cartesian_pose
        position_xyz: [0.400, -0.200, 0.220]
        quaternion_wxyz: [0.0, 0.0, 1.0, 0.0]
        pos_tol_m: 0.030
        rot_tol_rad: 0.200
      preconditions:
        required_classes:
          - workpiece
          - parts box
        forbidden_classes: []
        expected_relations:
          - subject_class: workpiece
            predicate: inside
            object_class: parts box
            min_score: 0.50
      allowed_situations: [NORMAL, S1, S2, S3, S4]
      expected_after_step: []

    - id: STEP1_GRASP
      phase: GRIPPER
      nominal_name: step1_grasp
      target_class: workpiece
      support_class: parts box
      destination_class: null
      replanning_enabled: false
      goal:
        type: named_action
        action_name: close_gripper_on_workpiece
      preconditions:
        required_classes:
          - parts box
        forbidden_classes: []
        expected_relations: []
      allowed_situations: [NORMAL, S2]
      expected_after_step:
        - subject_class: gripper
          predicate: gripping
          object_class: workpiece
          min_score: 0.50

